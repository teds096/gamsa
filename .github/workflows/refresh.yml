name: Refresh site data

on:
  schedule:
    - cron: "0 19 * * *"
    - cron: "30 19 1 * *"
  workflow_dispatch:

permissions: {contents: write, issues: write}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 rjsmin rcssmin

      - name: Supply data (daily)
        id: supply
        run: python scraper/refresh.py

      - name: Costs and PBS figures (monthly)
        continue-on-error: true
        id: costs
        if: github.event.schedule == '30 19 1 * *' || github.event_name == 'workflow_dispatch'
        run: python scraper/costs.py

      - name: Brand premiums, listings and substitution (monthly)
        if: github.event.schedule == '30 19 1 * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        id: premiums
        run: |
          python scraper/premiums.py | tee /tmp/premiums.log
          grep -q PREMIUMS_CHANGED /tmp/premiums.log && echo "changed=true" >> "$GITHUB_OUTPUT" || true

      - name: Inbox — new feedback or pending pharmacists (daily)
        continue-on-error: true
        id: inbox
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python scraper/inbox.py | tee /tmp/inbox.log
          grep -q INBOX_NEW /tmp/inbox.log && echo "new=true" >> "$GITHUB_OUTPUT" || true

      - name: Check the data still matches the content pages
        id: check
        run: python scraper/check.py

      - name: Rebuild the site
        id: build
        run: python build.py

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "site-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then echo "No change."; else
            git add -A && git commit -m "Refresh data ($(date -u +%Y-%m-%d))" && git push
          fi

      - name: Open an issue if a refresh broke
        if: failure() || steps.costs.outcome == 'failure' || steps.premiums.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "scraper"});
            if (open.length) return;
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: "Data refresh failed - site figures are going stale", labels: ["scraper"],
              body: "A scheduled refresh failed, so the site is serving its last good data. Usual cause: the TGA or PBS changed their page layout. The site degrades rather than breaking - nothing is overwritten with bad data."});

      - name: Note when brand premiums or listings changed
        if: steps.premiums.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const log = require("fs").readFileSync("/tmp/premiums.log", "utf8");
            const {data: open} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "pbs"});
            if (open.length) { core.info("pbs issue already open — not opening another"); return; }
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: "PBS brand premiums or listings changed — check the costs wording", labels: ["pbs"],
              body: "The monthly PBS check found changes. The figures on the site have updated automatically; read the costs page prose and the affected medicine pages in case the wording needs a human touch.\n\n```\n" + log + "\n```"});

      - name: Tell Ted about new feedback or registrations
        if: steps.inbox.outputs.new == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/inbox.md", "utf8"), title = fs.readFileSync("/tmp/inbox-title.txt", "utf8").trim();
            const {data: open} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "inbox"});
            if (open.length) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: "**" + title + "**\n\n" + body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["inbox"]});
            }

      # Run metadata for the external health check. Written and committed on every run,
      # success or failure. Never read by build.py and never a drift-guard input.
      - name: Write run status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const outcomes = {supply: "${{ steps.supply.outcome }}", costs: "${{ steps.costs.outcome }}", premiums: "${{ steps.premiums.outcome }}",
              inbox: "${{ steps.inbox.outcome }}", check: "${{ steps.check.outcome }}", build: "${{ steps.build.outcome }}", commit: "${{ steps.commit.outcome }}"};
            const failed = Object.keys(outcomes).filter(k => outcomes[k] === "failure");
            let issue = null;
            try {
              const {data: open} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "scraper"});
              if (open.length) issue = open[0].html_url;
            } catch (e) { core.warning("could not list issues: " + e.message); }
            const status = {finishedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"), ok: failed.length === 0, failedSteps: failed,
              issue, monthlyCostsRun: outcomes.costs !== "skipped"};
            fs.mkdirSync("data", {recursive: true});
            fs.writeFileSync("data/status.json", JSON.stringify(status, null, 2) + "\n");
            core.info(JSON.stringify(status));

      - name: Commit run status
        if: always()
        run: |
          git config user.name "site-bot"
          git config user.email "actions@github.com"
          git add data/status.json
          git diff --cached --quiet || (git commit -m "Run status ($(date -u +%Y-%m-%dT%H:%MZ))" && git push)
