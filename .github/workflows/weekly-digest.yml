name: Weekly digest

# Hub item B-13 (v19, 24 Oct 2026). Needs no secrets.
# Once a week (Monday about 09:00 Adelaide time) it gathers, for the last 7 days:
#   1. every failed or timed-out workflow run, grouped by workflow, with a link to the latest one,
#   2. every open issue (alerts such as scraper, down, live, backup, inbox ...), newest first,
#   3. issues opened during the week that are already closed again,
# and writes them into ONE new "Weekly digest" issue (label "digest"). The previous digest issue is closed.
# GitHub emails new issues to everyone watching the repo; this workflow sends no email itself.
on:
  schedule:
    - cron: '30 22 * * 0'   # Sunday 22:30 UTC = Monday 09:00 ACDT / 08:00 ACST
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Write the weekly digest issue
        uses: actions/github-script@v9
        with:
          script: |
            const o = context.repo.owner, r = context.repo.repo;
            const now = new Date(), since = new Date(now.getTime() - 7 * 864e5);
            const day = d => new Date(d).toISOString().slice(0, 10);
            const labelsOf = i => i.labels.map(l => typeof l === "string" ? l : l.name);
            const isDigest = i => labelsOf(i).includes("digest");

            // 1. failed runs: one query per bad result keeps each list small (the API caps a search at 1,000 runs)
            const runs = [];
            for (const status of ["failure", "timed_out", "startup_failure"]) {
              try {
                runs.push(...await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                  {owner: o, repo: r, status, created: ">=" + day(since), per_page: 100}));
              } catch (e) { core.warning(`could not list ${status} runs: ${e.message}`); }
            }
            const failed = runs.filter(x => new Date(x.created_at) >= since && x.name !== "Weekly digest");
            const byWf = {};
            for (const x of failed) (byWf[x.name] = byWf[x.name] || []).push(x);
            const wfLines = Object.entries(byWf)
              .sort((a, b) => b[1].length - a[1].length)
              .map(([name, xs]) => {
                xs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                return `- **${name}**: ${xs.length} failed run${xs.length > 1 ? "s" : ""}, latest ${day(xs[0].created_at)} ([open it](${xs[0].html_url}))`;
              });

            // 2. and 3. issues (pull requests are left out)
            const open = (await github.paginate(github.rest.issues.listForRepo, {owner: o, repo: r, state: "open", per_page: 100}))
              .filter(i => !i.pull_request && !isDigest(i));
            const recent = (await github.paginate(github.rest.issues.listForRepo, {owner: o, repo: r, state: "closed", since: since.toISOString(), per_page: 100}))
              .filter(i => !i.pull_request && !isDigest(i) && new Date(i.created_at) >= since);
            const line = i => `- #${i.number} ${i.title}` + (labelsOf(i).length ? ` (${labelsOf(i).join(", ")})` : "") +
              `, opened ${day(i.created_at)}` + (new Date(i.created_at) >= since ? " **new this week**" : "");

            const quiet = !failed.length && !open.length;
            const summary = quiet ? "all quiet" :
              `${failed.length} failed run${failed.length === 1 ? "" : "s"}, ${open.length} open issue${open.length === 1 ? "" : "s"}`;
            const body = [
              quiet ? "**All quiet this week:** no failed workflow runs and no open issues." :
                "**Something may need a look.** Start with the failed runs, then the open issues.",
              `Week ${day(since)} to ${day(now)} (UTC).`,
              "", "### Failed workflow runs", ...(wfLines.length ? wfLines : ["None."]),
              "", "### Open issues", ...(open.length ? open.map(line) : ["None."]),
              "", "### Opened and closed again this week", ...(recent.length ? recent.map(line) : ["None."]),
              "", "Nothing to do on this issue itself: next week's digest closes it.",
              `Made by the Weekly digest workflow: ${context.serverUrl}/${o}/${r}/actions/runs/${context.runId}`
            ].join("\n");

            const {data: prev} = await github.rest.issues.listForRepo({owner: o, repo: r, state: "open", labels: "digest", per_page: 100});
            const {data: made} = await github.rest.issues.create({owner: o, repo: r, labels: ["digest"],
              title: `Weekly digest ${day(now)}: ${summary}`, body});
            for (const i of prev) {
              await github.rest.issues.createComment({owner: o, repo: r, issue_number: i.number, body: `Replaced by #${made.number}. Closing.`});
              await github.rest.issues.update({owner: o, repo: r, issue_number: i.number, state: "closed"});
            }
            await core.summary.addRaw(`Weekly digest #${made.number}: ${summary}`).write();
